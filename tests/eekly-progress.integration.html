
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Les 26 – Weekly Progress Integration</title>

  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #24332d;
      background: #f5f7f5;
    }

    body {
      max-width: 1050px;
      margin: 35px auto;
      padding: 0 18px;
    }

    h1 { color: #207653; }

    .panel {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 12px #0000000a;
    }

    button {
      background: #207653;
      border: 0;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      background: #edf5ef;
      border-radius: 8px;
      padding: 15px;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-top: 6px;
    }

    .progress-track {
      background: #e5ebe6;
      height: 14px;
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-fill {
      background: #207653;
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 12px 8px;
      border-bottom: 1px solid #e5e9e5;
    }

    th {
      color: #65736b;
      font-size: 13px;
    }

    .future {
      color: #909a93;
      background: #fafbfa;
    }

    .pass {
      color: #207653;
      font-weight: 600;
    }

    .fail {
      color: #b42318;
      font-weight: 600;
    }

    .muted { color: #65736b; }

    .table-wrapper { overflow-x: auto; }

    @media (max-width: 650px) {
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <h1>Les 26 – Weekoverzicht</h1>

  <div class="panel">
    <p>
      We vergelijken je actuele beschikbaarheid met
      de uitgevoerde trainingen uit Intervals.icu.
    </p>

    <button id="loadButton">Bereken weekoverzicht</button>

    <p id="status" class="muted">
      Nog geen test uitgevoerd.
    </p>
  </div>

  <div class="panel" id="overview" hidden>
    <h2 id="weekTitle">Deze week</h2>

    <div class="stats">
      <div class="stat">
        Beschikbaar deze week
        <strong id="available">–</strong>
      </div>

      <div class="stat">
        Uitgevoerd
        <strong id="completed">–</strong>
      </div>

      <div class="stat">
        Trainingsload
        <strong id="load">–</strong>
      </div>
    </div>

    <h3>Weekvoortgang</h3>

    <div class="progress-track">
      <div id="progressBar" class="progress-fill"></div>
    </div>

    <p id="progressText"></p>
    <p id="elapsedText" class="muted"></p>

    <h3>Per dag</h3>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Dag</th>
            <th>Beschikbaar</th>
            <th>Getraind</th>
            <th>Activiteiten</th>
            <th>Load</th>
          </tr>
        </thead>
        <tbody id="dayRows"></tbody>
      </table>
    </div>

    <p id="qualityWarning" class="muted"></p>
  </div>

  <script type="module">
    import { supabase } from '../supabase-client.js';

    import {
      initializeAvailability
    } from '../availability-service.js';

    import {
      fetchIntervalsActivities
    } from '../intervals-api.js';

    import {
      buildWeeklyProgress,
      getWeekDates,
      formatTrainingMinutes
    } from '../weekly-progress.js';

    const button = document.getElementById('loadButton');
    const status = document.getElementById('status');
    const overview = document.getElementById('overview');
    const rows = document.getElementById('dayRows');

    const weekdayNames = [
      'Maandag',
      'Dinsdag',
      'Woensdag',
      'Donderdag',
      'Vrijdag',
      'Zaterdag',
      'Zondag'
    ];

    function addCell(row, text) {
      const cell = document.createElement('td');
      cell.textContent = String(text);
      row.appendChild(cell);
    }

    function renderOverview(progress) {
      document.getElementById('weekTitle').textContent =
        `Week ${progress.weekStart} t/m ${progress.weekEnd}`;

      document.getElementById('available').textContent =
        formatTrainingMinutes(
          progress.totalAvailableMinutes
        );

      document.getElementById('completed').textContent =
        formatTrainingMinutes(
          progress.totalCompletedMinutes
        );

      document.getElementById('load').textContent =
        String(Math.round(progress.totalTrainingLoad));

      const percentage = progress.weekProgressPercent;

      document.getElementById('progressBar').style.width =
        `${Math.min(100, percentage ?? 0)}%`;

      document.getElementById('progressText').textContent =
        percentage === null
          ? 'Geen beschikbare trainingsminuten geregistreerd.'
          : `${percentage}% van je totale weekbeschikbaarheid getraind.`;

      const elapsed = progress.elapsedUtilizationPercent;

      document.getElementById('elapsedText').textContent =
        elapsed === null
          ? 'Tot en met vandaag was geen trainingstijd beschikbaar.'
          : `Benutting tot en met vandaag: ${elapsed}%.`;

      rows.replaceChildren();

      progress.days.forEach((day, index) => {
        const row = document.createElement('tr');

        if (day.isFuture) {
          row.className = 'future';
        }

        addCell(
          row,
          `${weekdayNames[index]} (${day.date})`
        );

        addCell(
          row,
          formatTrainingMinutes(day.availableMinutes)
        );

        addCell(
          row,
          day.isFuture
            ? 'Nog niet'
            : formatTrainingMinutes(day.completedMinutes)
        );

        addCell(
          row,
          day.isFuture ? '–' : day.activityCount
        );

        addCell(
          row,
          day.isFuture
            ? '–'
            : Math.round(day.trainingLoad)
        );

        rows.appendChild(row);
      });

      const warning = document.getElementById(
        'qualityWarning'
      );

      warning.textContent =
        progress.missingDurationCount > 0
          ? `Let op: ${progress.missingDurationCount} ` +
            `activiteiten hebben geen bekende trainingsduur. ` +
            `De uitgevoerde tijd is mogelijk onvolledig.`
          : '';

      overview.hidden = false;
    }

    async function runIntegration() {
      button.disabled = true;
      overview.hidden = true;
      status.className = 'muted';
      status.textContent = 'Gegevens ophalen...';

      try {
        const { data, error } =
          await supabase.auth.getUser();

        if (error || !data.user) {
          throw new Error(
            'Log eerst in via index.html.'
          );
        }

        const today = new Date();
        const dates = getWeekDates(today);

        // Lees de bestaande beschikbaarheid.
        const { state } = await initializeAvailability(
          data.user.id,
          today
        );

        if (!state) {
          throw new Error(
            'Beschikbaarheidsstatus kon niet worden geladen.'
          );
        }

        const availabilityByDate = {};

        for (const date of dates) {
          availabilityByDate[date] =
            state.getEffective(date);
        }

        // Haal alleen de activiteiten van deze week op.
        const rawActivities =
          await fetchIntervalsActivities(
            dates[0],
            dates[6]
          );

        // Combineer beide gegevensbronnen.
        const progress = buildWeeklyProgress({
          date: today,
          availabilityByDate,
          rawActivities
        });

        renderOverview(progress);

        status.className = 'pass';
        status.textContent =
          'PASS – Beschikbaarheid en Intervals.icu ' +
          'succesvol gecombineerd.';

        console.log('Weekly progress:', progress);

      } catch (error) {
        console.error(error);

        status.className = 'fail';
        status.textContent =
          `FAIL – ${error.message}`;

      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener('click', runIntegration);
  </script>
</body>
</html>
